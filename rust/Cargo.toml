[package]
name = "cayley-kernel-cpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Exact CPU basis products for Cayley-Dickson algebras"
repository = "https://github.com/alikaperdue/CayleyKernel"

[lib]
name = "cayley_kernel_rust"
# Maturin requests cdylib explicitly; rlib also builds on no_std targets.
crate-type = ["rlib"]

[features]
default = []
no_std = []
python = ["dep:pyo3", "num-bigint/std"]

[dependencies]
num-bigint = { version = "0.4.6", default-features = false }
pyo3 = { version = "0.27.2", optional = true, features = ["num-bigint"] }

[profile.release]
lto = "thin"
codegen-units = 1
