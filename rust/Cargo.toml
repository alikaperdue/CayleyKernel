[package]
name = "cayley-kernel-cpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Exact CPU basis products for Cayley-Dickson algebras"
repository = "https://github.com/alikaperdue/CayleyKernel"

[lib]
name = "cayley_kernel_rust"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
num-bigint = "0.4.6"
pyo3 = { version = "0.27.2", optional = true, features = ["num-bigint"] }

[profile.release]
lto = "thin"
codegen-units = 1
