[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "cayley-kernel-rust"
version = "0.1.0"
description = "Optional exact Rust CPU accelerator for CayleyKernel"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.maturin]
features = ["python", "pyo3/extension-module"]
module-name = "cayley_kernel_rust"
