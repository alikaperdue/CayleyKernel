name: Release wheels

on:
  pull_request:
    paths:
      - '.github/workflows/wheels.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'CayleyKernel/**'
      - 'tests/integration/test_wheel_build.py'
      - 'tests/integration/wheel_smoke.py'
      - 'rust/**'
      - 'cuda/**'
      - 'scripts/build_wheel.sh'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      gpu_variant:
        description: 'Wheel to execute on the configured NVIDIA runner'
        type: choice
        default: none
        options:
          - none
          - cu118
          - cu120
          - cu121
  release:
    types: [published]

permissions:
  contents: read

jobs:
  python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine 'setuptools>=77.0.3' wheel
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m tests.integration.test_wheel_build -v
      - name: Install and exercise the portable wheel outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          CAYLEY_KERNEL_CPU_BACKEND: auto
        run: |
          python -m venv python-smoke
          python-smoke/bin/python -m pip install --only-binary=:all: "$GITHUB_WORKSPACE"/dist/*-py3-none-any.whl
          python-smoke/bin/python -m pip check
          python-smoke/bin/python -I "$GITHUB_WORKSPACE/tests/integration/wheel_smoke.py" python
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*

  rust-wheels:
    needs: python-wheel
    name: Rust / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release --locked --manifest-path rust/Cargo.toml
            --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
            --out rust-wheelhouse
          manylinux: auto
      - run: python -m pip install twine
      - run: python -m twine check rust-wheelhouse/*.whl
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: python-wheelhouse
      - name: Install wheels with normal dependency resolution
        shell: bash
        run: |
          wheels=(python-wheelhouse/*-py3-none-any.whl)
          python -m pip install --only-binary=:all: "${wheels[0]}[rust]" rust-wheelhouse/*.whl
          python -m pip check
      - name: Verify installed native backend outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          CAYLEY_KERNEL_CPU_BACKEND: auto
        run: python -I "${{ github.workspace }}/tests/integration/wheel_smoke.py" rust
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.os }}-py${{ matrix.python }}
          path: rust-wheelhouse/*.whl

  cuda-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: 11.8.0
            variant: cu118
            archs: sm_75 sm_80 sm_86 sm_89 sm_90
          - cuda: 12.0.1
            variant: cu120
            archs: sm_75 sm_80 sm_86 sm_89 sm_90
          - cuda: 12.1.1
            variant: cu121
            archs: sm_75 sm_80 sm_86 sm_89 sm_90
    container: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-venv make
          # Ubuntu 22.04 ships patchelf 0.14.3; auditwheel needs >=0.14.5.
          # wheel >=0.41 supports tags with alphanumeric build identifiers.
          python3 -m pip install build auditwheel 'wheel>=0.41' twine 'patchelf>=0.14.5'
          patchelf --version
          python3 -m wheel tags --help
      - name: Compile and repair wheel
        env:
          ARCHS: ${{ matrix.archs }}
        run: bash scripts/build_wheel.sh
      - name: Give each CUDA variant a unique release filename
        run: python3 -m wheel tags --build=1${{ matrix.variant }} --remove wheelhouse/*.whl
      - run: python3 -m twine check wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-${{ matrix.variant }}-linux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  cuda-install:
    needs: cuda-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: cuda-*-linux-x86_64
          path: cuda-wheelhouse
          merge-multiple: true
      - name: Install each variant and verify its native ABI on the host runner
        working-directory: ${{ runner.temp }}
        run: |
          for wheel in "$GITHUB_WORKSPACE"/cuda-wheelhouse/*.whl; do
            env_dir=$(mktemp -d)
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install --only-binary=:all: "$wheel"
            "$env_dir/bin/python" -m pip check
            "$env_dir/bin/python" -I "$GITHUB_WORKSPACE/tests/integration/wheel_smoke.py" cuda-load

            extra=cuda12
            if [[ "$wheel" == *-1cu118-* ]]; then
              extra=cuda11
            fi
            "$env_dir/bin/python" -m pip install --only-binary=:all: "${wheel}[${extra}]"
            "$env_dir/bin/python" -m pip check
          done

  cuda-execution:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_variant != 'none' && vars.CI_GPU_LABEL != ''
    needs: cuda-install
    runs-on: ${{ vars.CI_GPU_LABEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cuda-${{ inputs.gpu_variant }}-linux-x86_64
          path: cuda-wheelhouse
      - name: Install the selected wheel with CuPy and run a GPU product
        working-directory: ${{ runner.temp }}
        env:
          CUDA_EXTRA: ${{ inputs.gpu_variant == 'cu118' && 'cuda11' || 'cuda12' }}
        run: |
          env_dir=$(mktemp -d)
          python -m venv "$env_dir"
          wheels=("$GITHUB_WORKSPACE"/cuda-wheelhouse/*.whl)
          "$env_dir/bin/python" -m pip install --only-binary=:all: "${wheels[0]}[${CUDA_EXTRA}]"
          "$env_dir/bin/python" -m pip check
          "$env_dir/bin/python" -I "$GITHUB_WORKSPACE/tests/integration/wheel_smoke.py" cuda-execute

  publish:
    if: github.event_name == 'release'
    needs: [python-wheel, rust-wheels, cuda-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach tested distributions to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
