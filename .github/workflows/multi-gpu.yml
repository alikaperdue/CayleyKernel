name: Multi-GPU

on:
  pull_request:
    paths:
      - '.github/workflows/multi-gpu.yml'
      - 'CayleyKernel/_distributed.py'
      - 'CayleyKernel/__init__.py'
      - 'tests/test_multi_gpu.py'
      - 'docs/multi-gpu.md'
      - 'pyproject.toml'
      - 'Makefile'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Run on a GPU-enabled runner when the org has one (label `gpu-2x`);
# otherwise fall back to the standard `ubuntu-latest` runner, which has
# no CUDA devices — the tests self-skip via the module-level
# `pytestmark = pytest.mark.skipif(len(visible_devices()) < 2, ...)`
# guard, and we mark the job `continue-on-error: true` so a single-GPU
# (or zero-GPU) CI box still passes.
jobs:
  multi-gpu:
    name: tests/test_multi_gpu.py on 2-GPU runner (else self-skip)
    runs-on: ${{ vars.CI_GPU_2X_LABEL || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies (no new packages; CuPy + pytest only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          # CuPy needs a matching CUDA toolkit at runtime; on a CUDA-less
          # runner the import fails and the module-level pytestmark
          # guard skips the whole file, which is exactly what we want.
          python -m pip install cupy-cuda12x || true
          python -m pip install --no-deps -e .

      - name: Build the CUDA kernel (skipped automatically when nvcc is missing)
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            make kernel
          else
            echo "nvcc not found on this runner; GPU tests will self-skip"
          fi

      - name: Run the multi-GPU test file
        run: |
          python -m pytest -v tests/test_multi_gpu.py
        env:
          # Keep the test's module-level skip guard honest: if the
          # runner only has one (or zero) CUDA devices, the guard
          # skips every test in the file.
          CAYLEY_KERNEL_BLOCK_SIZE: '256'

      - name: Show device topology (informational)
        if: always()
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi topo -m || true
            nvidia-smi -L || true
          else
            echo "nvidia-smi not present on this runner"
          fi
