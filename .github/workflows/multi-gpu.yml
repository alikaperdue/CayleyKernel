name: Multi-GPU

on:
  pull_request:
    paths:
      - '.github/workflows/multi-gpu.yml'
      - 'CayleyKernel/**'
      - 'cuda/**'
      - 'tests/conftest.py'
      - 'tests/support/**'
      - 'tests/integration/test_multi_gpu.py'
      - 'docs/multi-gpu.md'
      - 'pyproject.toml'
      - 'Makefile'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Use the configured GPU runner when available. The hosted fallback can
# skip device-dependent tests when the GPU stack is unavailable.
jobs:
  multi-gpu:
    name: Multi-GPU correctness
    runs-on: ${{ vars.CI_GPU_2X_LABEL || 'ubuntu-latest' }}
    continue-on-error: ${{ vars.CI_GPU_2X_LABEL == '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies on the GPU runner
        if: vars.CI_GPU_2X_LABEL != ''
        run: python -m pip install -e '.[test,cuda12]'

      - name: Install dependencies on the hosted fallback
        if: vars.CI_GPU_2X_LABEL == ''
        run: python -m pip install -e '.[test]'

      - name: Build the CUDA kernel on the GPU runner
        if: vars.CI_GPU_2X_LABEL != ''
        run: make kernel

      - name: Run correctness tests
        run: python -m pytest -v tests/integration/test_multi_gpu.py ${{ vars.CI_GPU_2X_LABEL && '--require-gpu' || '' }}
        env:
          CAYLEY_KERNEL_BLOCK_SIZE: '256'

      - name: Show device topology (informational)
        if: always()
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi topo -m || true
            nvidia-smi -L || true
          else
            echo "nvidia-smi not present on this runner"
          fi
