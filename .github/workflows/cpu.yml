name: CPU and Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format (Python + C/CUDA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff (version pinned for reproducibility)
        run: python -m pip install ruff==0.9.7
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format --dry-run (CUDA / C++)
        run: >
          clang-format --dry-run --Werror
          cuda/cuda_kernel.cu cuda/amd_kernel.cu cuda/tools/compare_sign_tables.cpp

  cpu:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Python tests and package without GPU dependencies
        run: python -m pip install -e '.[test,research-test]'
      - name: Check repository skill API and examples (GPU syntax only)
        env:
          CAYLEY_KERNEL_CPU_BACKEND: python
        run: python skill/check_drift.py --self-test
      - name: Verify Python fallback and research regressions before installing Rust
        env:
          CAYLEY_KERNEL_CPU_BACKEND: python
        run: python -m pytest -q -m "cpu and not slow" tests/
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Test standalone Rust library
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Check no_std library
        run: cargo check --manifest-path rust/Cargo.toml --locked --no-default-features --features no_std
      - name: Test no_std library
        run: cargo test --manifest-path rust/Cargo.toml --locked --no-default-features --features no_std
      - name: Check no_std WebAssembly library
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --manifest-path rust/Cargo.toml --locked --no-default-features --features no_std --target wasm32-unknown-unknown
      - name: Install optional Rust extension
        run: python -m pip install ./rust
      - name: Lint Rust and Python bindings
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets --features python -- -D warnings
      - name: Verify native CPU operations and research scripts
        env:
          CAYLEY_KERNEL_CPU_BACKEND: rust
          CAYLEY_TEST_REQUIRE_RUST: '1'
        run: python -m pytest -q -m "cpu and not slow" tests/
      - name: Verify independent sparse zero-divisor oracle
        env:
          CAYLEY_KERNEL_CPU_BACKEND: rust
        run: python -m pytest -q tests/core/test_sparse_zd.py --run-sparse-zd --zd-levels=4,32,256 --zd-samples=16 --zd-repeats=1
